<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Calm HUD</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        :root {
            --bg-page: #FFF8F5;
            --bg-surface: rgba(255, 252, 250, 0.88);
            --text-primary: #3D312E;
            --text-secondary: #8C7A76;
            --chip-peach: #FFD6B8;
            --chip-apricot: #FFB86C;
            --focus-bg: linear-gradient(135deg, #C8F0C5 0%, #DFFAB0 60%, #FFF2CC 100%);
            --focus-glow: rgba(168, 230, 163, 0.50);
            --focus-label: #3A6B36;
            --border-soft: rgba(255, 255, 255, 0.65);
            --spring: cubic-bezier(0.34, 1.56, 0.64, 1);
            --coral: #FF8A7A;
            --task-blue: #C5E2F6;
            --routine-green: #DFFAB0;
            --border-line: rgba(0, 0, 0, 0.06);
        }

        body {
            min-height: 100vh;
            background-color: #e2e8f0;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: "Inter", system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
            color: var(--text-primary);
        }

        button,
        input {
            font: inherit;
        }

        button {
            cursor: pointer;
        }

        .iphone-frame {
            width: min(100vw, 393px);
            height: min(100vh, 852px);
            min-height: 720px;
            background-color: var(--bg-page);
            position: relative;
            overflow: hidden;
            border: 12px solid #2d322b;
            border-radius: 54px;
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.25);
        }

        .dynamic-island {
            width: 120px;
            height: 35px;
            background: #000;
            border-radius: 20px;
            position: absolute;
            top: 12px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 20;
        }

        .screen {
            position: absolute;
            inset: 0;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s ease;
        }

        .screen.active {
            opacity: 1;
            pointer-events: auto;
        }

        #screen-speak {
            display: flex;
            flex-direction: column;
            padding: 70px 24px 40px;
        }

        .speak-title {
            font-size: 24px;
            font-weight: 600;
            line-height: 1.35;
            color: var(--text-primary);
        }

        .mic-section {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .giant-mic {
            width: 220px;
            height: 220px;
            border-radius: 50%;
            background: var(--focus-bg);
            border: none;
            box-shadow: 0 12px 48px var(--focus-glow);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: transform 0.3s var(--spring);
        }

        .giant-mic:active {
            transform: scale(0.9);
        }

        .mic-icon {
            font-size: 56px;
            margin-bottom: 8px;
            line-height: 1;
        }

        .mic-text {
            font-size: 14px;
            font-weight: 700;
            color: var(--focus-label);
        }

        .input-bar {
            background: var(--bg-surface);
            backdrop-filter: blur(20px) saturate(1.6);
            border: 1px solid var(--border-soft);
            border-radius: 100px;
            padding: 16px 20px 16px 24px;
            display: flex;
            align-items: center;
            box-shadow: 0 4px 12px rgba(61,49,46,0.05);
        }

        .input-bar input {
            flex: 1;
            min-width: 0;
            border: none;
            background: transparent;
            outline: none;
            font-size: 15px;
            color: var(--text-primary);
        }

        .send-btn {
            width: 34px;
            height: 34px;
            border: none;
            border-radius: 50%;
            background: var(--chip-apricot);
            color: #fff;
            font-size: 18px;
            font-weight: 800;
            line-height: 1;
            margin-left: 8px;
        }

        .status-msg {
            text-align: center;
            font-size: 11px;
            font-weight: 700;
            color: var(--text-secondary);
            letter-spacing: 0.1em;
            margin-top: 16px;
            animation: pulse 2.4s infinite ease-in-out;
        }

        #screen-microstep {
            display: flex;
            flex-direction: column;
            padding: 70px 24px 24px;
        }

        .ms-title {
            font-size: 22px;
            font-weight: 600;
            color: var(--text-primary);
        }

        .ms-subtitle {
            font-size: 12px;
            color: var(--text-secondary);
            margin-top: 4px;
        }

        .timeline-scroll {
            flex: 1;
            overflow-y: auto;
            margin-top: 4px;
        }

        .timeline-scroll::-webkit-scrollbar,
        #screen-dashboard::-webkit-scrollbar {
            display: none;
        }

        .timeline-wrap {
            position: relative;
            padding-left: 32px;
            padding-top: 16px;
            padding-bottom: 8px;
        }

        .timeline-wrap::before {
            content: "";
            position: absolute;
            left: 7px;
            top: 0;
            bottom: 0;
            width: 2px;
            background-image: linear-gradient(to bottom, var(--chip-apricot) 33%, rgba(255,255,255,0) 0%);
            background-size: 2px 10px;
            background-repeat: repeat-y;
        }

        .task-node {
            position: relative;
            margin-bottom: 20px;
            animation: slideUp 0.5s var(--spring) forwards;
            opacity: 0;
        }

        .task-node::before {
            content: "";
            position: absolute;
            left: -30px;
            top: 20px;
            width: 12px;
            height: 12px;
            background: var(--chip-apricot);
            border: 3px solid #fff;
            border-radius: 50%;
            z-index: 2;
        }

        .task-card {
            background: var(--bg-surface);
            backdrop-filter: blur(20px) saturate(1.6);
            border: 1px solid var(--border-soft);
            border-radius: 20px;
            padding: 18px 20px;
            box-shadow: 0 4px 12px rgba(61,49,46,0.05);
        }

        .task-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 10px;
            gap: 8px;
        }

        .task-title {
            font-size: 15px;
            font-weight: 600;
            color: var(--text-primary);
            line-height: 1.4;
        }

        .task-time {
            font-family: "JetBrains Mono", monospace;
            font-size: 12px;
            font-weight: 500;
            color: var(--focus-label);
            background: var(--focus-bg);
            padding: 3px 10px;
            border-radius: 100px;
            white-space: nowrap;
            flex-shrink: 0;
        }

        .cat-toggle {
            display: flex;
            gap: 8px;
        }

        .cat-btn {
            font-size: 11px;
            font-weight: 700;
            padding: 5px 12px;
            border-radius: 100px;
            border: none;
            background: rgba(0,0,0,0.04);
            color: var(--text-secondary);
            transition: background 0.2s, color 0.2s;
        }

        .cat-btn.active {
            background: var(--chip-peach);
            color: #8A4800;
        }

        .send-pc-btn {
            width: 100%;
            padding: 16px;
            border-radius: 20px;
            border: none;
            background: linear-gradient(135deg, #FFB86C, #FF8A7A);
            color: #fff;
            font-size: 16px;
            font-weight: 700;
            margin-top: 12px;
            box-shadow: 0 8px 24px rgba(255,138,122,0.35);
            transition: transform 0.2s var(--spring), box-shadow 0.2s;
            flex-shrink: 0;
        }

        .send-pc-btn:active {
            transform: scale(0.97);
            box-shadow: 0 4px 12px rgba(255,138,122,0.2);
        }

        #screen-stop {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 70px 28px 48px;
            gap: 28px;
            background: linear-gradient(to bottom, #FF8A7A 0%, #FFD6B8 100%);
        }

        .stop-label {
            font-size: 12px;
            font-weight: 700;
            color: rgba(255,255,255,0.9);
            letter-spacing: 0.14em;
            text-transform: uppercase;
        }

        .stop-task-name {
            font-size: 20px;
            font-weight: 600;
            color: var(--text-primary);
            text-align: center;
            line-height: 1.45;
        }

        .stop-pill {
            display: flex;
            align-items: center;
            max-width: 100%;
            gap: 14px;
            padding: 14px 22px;
            background: rgba(255,255,255,0.72);
            backdrop-filter: blur(24px) saturate(1.6);
            border-radius: 100px;
            box-shadow: 0 12px 48px rgba(255,138,122,0.4), inset 0 0 0 1px rgba(255,255,255,0.5);
        }

        .stop-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #FF8A7A;
            animation: pulse-dot 2.5s infinite ease-in-out;
            box-shadow: 0 0 10px rgba(255,138,122,0.8);
            flex-shrink: 0;
        }

        .stop-pill-info {
            display: flex;
            flex-direction: column;
            min-width: 0;
        }

        .stop-pill-label {
            font-size: 10px;
            font-weight: 700;
            color: #FF8A7A;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            line-height: 1.3;
        }

        .stop-pill-task {
            max-width: 150px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            font-size: 14px;
            font-weight: 600;
            color: var(--text-primary);
        }

        .stop-divider {
            width: 1px;
            height: 16px;
            background: rgba(255,138,122,0.25);
        }

        .stop-timer {
            font-family: "JetBrains Mono", monospace;
            font-size: 14px;
            color: rgba(61,49,46,0.6);
            font-weight: 500;
        }

        .stop-hint {
            font-size: 13px;
            color: rgba(61,49,46,0.6);
            text-align: center;
            line-height: 1.65;
        }

        .done-btn {
            width: 100%;
            padding: 16px;
            border-radius: 20px;
            border: none;
            background: rgba(255,255,255,0.88);
            color: #FF8A7A;
            font-size: 16px;
            font-weight: 700;
            box-shadow: 0 4px 16px rgba(255,138,122,0.2);
            transition: transform 0.2s var(--spring);
        }

        .done-btn:active {
            transform: scale(0.97);
        }

        #screen-dashboard {
            display: flex;
            flex-direction: column;
            padding: 65px 24px 40px;
            overflow-y: auto;
        }

        .chart-wrap {
            position: relative;
            width: 180px;
            height: 180px;
            margin: 0 auto 24px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .circular-chart {
            width: 100%;
            height: 100%;
            transform: rotate(-90deg);
        }

        .circle-bg {
            fill: none;
            stroke: #eee;
            stroke-width: 3;
        }

        .circle-fill {
            fill: none;
            stroke-width: 3;
            stroke-linecap: round;
            stroke: var(--coral);
            stroke-dasharray: 0, 100;
            transition: stroke-dasharray 0.4s ease;
        }

        .chart-info {
            position: absolute;
            text-align: center;
        }

        .pct {
            font-family: "JetBrains Mono", monospace;
            font-size: 36px;
            font-weight: 700;
            color: var(--text-primary);
        }

        .pct-label {
            font-size: 11px;
            font-weight: 600;
            color: var(--text-secondary);
            margin-top: 2px;
        }

        .summary-bar {
            display: flex;
            justify-content: space-between;
            margin-bottom: 28px;
            background: #fff;
            padding: 15px;
            border-radius: 20px;
            border: 1px solid var(--border-line);
        }

        .sum-item {
            text-align: center;
            flex: 1;
        }

        .sum-item + .sum-item {
            border-left: 1px solid var(--border-line);
        }

        .s-label {
            font-size: 10px;
            font-weight: 700;
            color: var(--text-secondary);
            display: block;
            margin-bottom: 4px;
        }

        .s-val {
            font-family: "JetBrains Mono", monospace;
            font-size: 15px;
            font-weight: 700;
            color: var(--text-primary);
        }

        .diary-grid {
            display: grid;
            grid-template-columns: 1fr 65px;
            gap: 15px;
            flex: 1;
        }

        .checklist-section {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .sec-title {
            font-size: 11px;
            font-weight: 800;
            color: var(--text-secondary);
            letter-spacing: 0.05em;
            text-transform: uppercase;
        }

        .check-item {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            margin-top: 10px;
        }

        .chk-box {
            min-width: 18px;
            height: 18px;
            border: 1.5px solid var(--text-primary);
            border-radius: 3px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: 900;
        }

        .chk-text {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-primary);
            line-height: 1.4;
        }

        .hl-blue {
            background: linear-gradient(to top, var(--task-blue) 45%, transparent 45%);
        }

        .hl-green {
            background: linear-gradient(to top, var(--routine-green) 45%, transparent 45%);
        }

        .time-marks {
            border-left: 1px solid var(--border-line);
            padding-left: 10px;
            display: flex;
            flex-direction: column;
        }

        .time-slot {
            display: flex;
            align-items: center;
            height: 26px;
            gap: 6px;
        }

        .hour {
            font-family: "JetBrains Mono", monospace;
            font-size: 9px;
            color: var(--text-secondary);
            width: 15px;
            text-align: right;
        }

        .bar {
            flex: 1;
            height: 22px;
            border-radius: 3px;
        }

        .bar.work {
            background: var(--task-blue);
            border-left: 3px solid #7BB6E0;
        }

        .bar.routine {
            background: var(--routine-green);
            border-left: 3px solid #B7D980;
        }

        .bar.none {
            background: rgba(0,0,0,0.02);
        }

        .insight-footer {
            margin-top: 24px;
            background: #fdf6e3;
            padding: 18px;
            border-radius: 20px;
            font-size: 13px;
            color: #5d5645;
            line-height: 1.55;
            border: 1px solid #efe3c1;
        }

        .toast {
            position: absolute;
            left: 24px;
            right: 24px;
            bottom: 24px;
            z-index: 30;
            border-radius: 20px;
            padding: 14px 16px;
            background: rgba(61,49,46,0.9);
            color: #fff;
            font-size: 13px;
            text-align: center;
            opacity: 0;
            transform: translateY(12px);
            pointer-events: none;
            transition: opacity 0.2s ease, transform 0.2s ease;
        }

        .toast.show {
            opacity: 1;
            transform: translateY(0);
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.4; }
            50% { opacity: 1; }
        }

        @keyframes pulse-dot {
            0%, 100% { transform: scale(0.95); opacity: 0.8; }
            50% { transform: scale(1.2); opacity: 1; }
        }

        @media (max-width: 430px) {
            body {
                display: block;
                background-color: var(--bg-page);
            }

            .iphone-frame {
                width: 100vw;
                height: 100vh;
                min-height: 100vh;
                border: none;
                border-radius: 0;
                box-shadow: none;
            }

            .dynamic-island {
                display: none;
            }

            #screen-speak,
            #screen-microstep,
            #screen-stop,
            #screen-dashboard {
                padding-top: max(28px, env(safe-area-inset-top));
                padding-bottom: max(24px, env(safe-area-inset-bottom));
            }
        }
    </style>
</head>
<body>
    <div class="iphone-frame">
        <div class="dynamic-island"></div>

        <section id="screen-speak" class="screen active" aria-label="목표 입력">
            <h1 class="speak-title">오늘 머릿속에 있는 일을<br>작게 잡아볼까요?</h1>

            <div class="mic-section">
                <button class="giant-mic" id="mic-btn" type="button">
                    <span class="mic-icon">🎙</span>
                    <span class="mic-text">말로 시작하기</span>
                </button>
            </div>

            <div class="input-bar">
                <input type="text" id="manual-input" autocomplete="off" placeholder="직접 입력해도 괜찮아요...">
                <button class="send-btn" id="send-btn" type="button" aria-label="목표 보내기">›</button>
            </div>
            <p class="status-msg" id="speak-status">AI가 당신의 말을 듣기 위해 대기 중입니다</p>
        </section>

        <section id="screen-microstep" class="screen" aria-label="마이크로 태스크">
            <p class="ms-title">오늘의 마이크로 스텝</p>
            <p class="ms-subtitle" id="ms-subtitle">AI가 쪼갠 오늘의 작은 일들이에요</p>

            <div class="timeline-scroll">
                <div class="timeline-wrap" id="dynamic-tasks"></div>
            </div>

            <button class="send-pc-btn" id="send-pc-btn" type="button">PC로 보내고 시작하기</button>
        </section>

        <section id="screen-stop" class="screen" aria-label="PC 작업 중">
            <span class="stop-label">PC 작업 중</span>

            <p class="stop-task-name" id="stop-task-name">작업을 시작하는 중입니다</p>

            <div class="stop-pill">
                <div class="stop-dot"></div>
                <div class="stop-pill-info">
                    <span class="stop-pill-label">Ready to come back?</span>
                    <span class="stop-pill-task" id="stop-pill-task">현재 작업</span>
                </div>
                <div class="stop-divider"></div>
                <span class="stop-timer" id="stop-timer">00:00</span>
            </div>

            <p class="stop-hint">PC에서 작업을 진행하고 있어요.<br>완료하면 아래 버튼을 눌러주세요.</p>

            <button class="done-btn" id="done-btn" type="button">오늘 작업 완료</button>
        </section>

        <section id="screen-dashboard" class="screen" aria-label="작업 대시보드">
            <div class="chart-wrap">
                <svg viewBox="0 0 36 36" class="circular-chart" aria-hidden="true">
                    <path class="circle-bg" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831"/>
                    <path class="circle-fill" id="circle-fill" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831"/>
                </svg>
                <div class="chart-info">
                    <div class="pct" id="completion-pct">0%</div>
                    <div class="pct-label">COMPLETE</div>
                </div>
            </div>

            <div class="summary-bar">
                <div class="sum-item"><span class="s-label">집중</span><span class="s-val" id="focus-minutes">0m</span></div>
                <div class="sum-item"><span class="s-label">초과</span><span class="s-val" id="overrun-minutes" style="color:var(--coral)">+0m</span></div>
                <div class="sum-item"><span class="s-label">분산</span><span class="s-val" id="distraction-count">0회</span></div>
            </div>

            <div class="diary-grid">
                <div class="checklist-section">
                    <div>
                        <p class="sec-title">Deep Work</p>
                        <div id="work-review"></div>
                    </div>
                    <div>
                        <p class="sec-title">Routine</p>
                        <div id="routine-review"></div>
                    </div>
                </div>

                <div class="time-marks" id="time-marks"></div>
            </div>

            <div class="insight-footer" id="insight-footer">
                <b>패턴 피드백</b><br>
                오늘은 작은 단위로 시작한 것이 가장 큰 도움이 되었어요. 다음에는 첫 스텝을 더 짧게 잡아도 좋아요.
            </div>
        </section>

        <div class="toast" id="toast"></div>
    </div>

    <script>
        let timerInterval = null;
        let timerSeconds = 0;
        let currentPlan = null;
        let currentStatus = null;
        let statusTimer = null;

        const $ = (id) => document.getElementById(id);

        function toast(message) {
            const box = $("toast");
            box.textContent = message;
            box.classList.add("show");
            window.clearTimeout(window.toastTimer);
            window.toastTimer = window.setTimeout(() => box.classList.remove("show"), 2200);
        }

        function showScreen(id) {
            document.querySelectorAll(".screen").forEach((screen) => screen.classList.remove("active"));
            $("screen-" + id).classList.add("active");
        }

        function formatSeconds(seconds) {
            const safe = Math.max(0, Number(seconds) || 0);
            const minutes = Math.floor(safe / 60);
            const rest = safe % 60;
            return `${String(minutes).padStart(2, "0")}:${String(rest).padStart(2, "0")}`;
        }

        function minutesLabel(minutes) {
            return `${Number(minutes) || 0}분`;
        }

        function buildFallbackPlan(goal) {
            const goalText = goal || "오늘 할 일";
            const lowerGoal = goalText.toLowerCase();
            let steps;

            if (lowerGoal.includes("report") || lowerGoal.includes("essay") || lowerGoal.includes("레포트") || lowerGoal.includes("보고서") || lowerGoal.includes("과제")) {
                steps = [
                    ["문서 열고 제목만 쓰기", 5, "WORK"],
                    ["자료 링크 3개 찾기", 12, "WORK"],
                    ["목차를 세 줄로 잡기", 8, "WORK"],
                    ["서론 초안 세 문장 쓰기", 10, "WORK"],
                    ["물 한 잔 마시고 다음 줄 남기기", 5, "ROUTINE"]
                ];
            } else if (lowerGoal.includes("study") || lowerGoal.includes("exam") || lowerGoal.includes("공부") || lowerGoal.includes("시험")) {
                steps = [
                    ["공부할 범위 한 장에 적기", 5, "WORK"],
                    ["가장 쉬운 개념 3개 체크하기", 10, "WORK"],
                    ["헷갈리는 부분 2개 표시하기", 10, "WORK"],
                    ["짧은 문제나 예시 3개 풀기", 15, "WORK"],
                    ["스트레칭하고 다음 복습점 적기", 5, "ROUTINE"]
                ];
            } else {
                steps = [
                    ["작업 화면 열기", 5, "WORK"],
                    ["해야 할 일을 세 덩어리로 나누기", 8, "WORK"],
                    ["가장 쉬운 첫 조각만 끝내기", 12, "WORK"],
                    ["막히는 지점 하나 적기", 5, "WORK"],
                    ["짧게 쉬고 다음 행동 남기기", 5, "ROUTINE"]
                ];
            }

            return {
                plan_id: `local_${Date.now()}`,
                goal_title: goalText,
                metadata_permission: true,
                blocked_apps: [],
                blocked_sites: [],
                steps: steps.map(([title, duration, category], index) => ({
                    id: `step_${index + 1}`,
                    title,
                    duration_minutes: duration,
                    category,
                    status: "pending",
                    order: index + 1
                }))
            };
        }

        function normalizePlan(plan) {
            const steps = Array.isArray(plan?.steps) ? plan.steps : [];
            return {
                ...plan,
                metadata_permission: Boolean(plan?.metadata_permission ?? true),
                blocked_apps: Array.isArray(plan?.blocked_apps) ? plan.blocked_apps : [],
                blocked_sites: Array.isArray(plan?.blocked_sites) ? plan.blocked_sites : [],
                steps: steps.map((step, index) => ({
                    id: step.id || `step_${index + 1}`,
                    title: step.title || "작은 작업",
                    duration_minutes: Number(step.duration_minutes) || 5,
                    category: step.category === "ROUTINE" ? "ROUTINE" : "WORK",
                    status: step.status || "pending",
                    order: Number(step.order) || index + 1
                }))
            };
        }

        function renderTasks(plan) {
            currentPlan = normalizePlan(plan);
            const tasks = currentPlan.steps;
            const container = $("dynamic-tasks");
            container.innerHTML = "";

            tasks.forEach((task, index) => {
                const node = document.createElement("div");
                node.className = "task-node";
                node.style.animationDelay = `${(index + 1) * 0.12}s`;

                const card = document.createElement("div");
                card.className = "task-card";

                const header = document.createElement("div");
                header.className = "task-header";

                const title = document.createElement("span");
                title.className = "task-title";
                title.textContent = task.title;

                const time = document.createElement("span");
                time.className = "task-time";
                time.textContent = minutesLabel(task.duration_minutes);

                header.append(title, time);

                const toggle = document.createElement("div");
                toggle.className = "cat-toggle";
                toggle.append(createCategoryButton(task, "WORK"), createCategoryButton(task, "ROUTINE"));

                card.append(header, toggle);
                node.appendChild(card);
                container.appendChild(node);
            });

            $("ms-subtitle").textContent = `총 ${tasks.length}개의 마이크로 스텝으로 쪼갰어요`;
            showScreen("microstep");
        }

        function createCategoryButton(task, category) {
            const button = document.createElement("button");
            button.type = "button";
            button.className = `cat-btn ${task.category === category ? "active" : ""}`;
            button.textContent = category === "WORK" ? "Work" : "Routine";
            button.addEventListener("click", () => {
                task.category = category;
                if (currentPlan) {
                    const planStep = currentPlan.steps.find((step) => step.id === task.id);
                    if (planStep) planStep.category = category;
                }
                button.parentElement.querySelectorAll(".cat-btn").forEach((item) => item.classList.remove("active"));
                button.classList.add("active");
            });
            return button;
        }

        async function makePlanFromGoal(goalText) {
            const goal = goalText.trim();
            if (!goal) {
                toast("큰 목표를 한 줄만 적어주세요.");
                $("manual-input").focus();
                return;
            }

            $("send-btn").disabled = true;
            $("speak-status").textContent = "AI가 목표를 작은 단계로 나누고 있어요";
            try {
                const response = await fetch("/api/mobile/plan", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        goal,
                        total_minutes: 45,
                        metadata_permission: true,
                        blocked_apps: [],
                        blocked_sites: []
                    })
                });
                if (!response.ok) throw new Error("plan failed");
                renderTasks(await response.json());
            } catch (error) {
                renderTasks(buildFallbackPlan(goal));
                toast("서버 없이 미리보기 계획을 만들었어요.");
            } finally {
                $("send-btn").disabled = false;
                $("speak-status").textContent = "AI가 당신의 말을 듣기 위해 대기 중입니다";
            }
        }

        function firstRunnableStep() {
            return currentPlan?.steps?.find((step) => step.status !== "completed") || currentPlan?.steps?.[0];
        }

        async function startPlan() {
            if (!currentPlan) {
                toast("먼저 목표를 작은 작업으로 나눠주세요.");
                return;
            }

            const nextStep = firstRunnableStep();
            if (nextStep) {
                $("stop-task-name").textContent = nextStep.title;
                $("stop-pill-task").textContent = nextStep.title;
            }

            $("send-pc-btn").disabled = true;
            try {
                const response = await fetch("/api/mobile/start_plan", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        plan_id: currentPlan.plan_id,
                        plan: currentPlan
                    })
                });
                if (!response.ok) throw new Error("start failed");
                const data = await response.json();
                currentPlan = normalizePlan(data.plan || currentPlan);
                startStopTimer();
                showScreen("stop");
                await fetchStatus();
                statusTimer = window.setInterval(fetchStatus, 3000);
            } catch (error) {
                startStopTimer();
                showScreen("stop");
                toast("서버 없이 미리보기 작업을 시작했어요.");
            } finally {
                $("send-pc-btn").disabled = false;
            }
        }

        function startStopTimer() {
            timerSeconds = 0;
            window.clearInterval(timerInterval);
            $("stop-timer").textContent = "00:00";
            timerInterval = window.setInterval(() => {
                timerSeconds += 1;
                $("stop-timer").textContent = formatSeconds(timerSeconds);
            }, 1000);
        }

        async function completeCurrentTask() {
            try {
                const response = await fetch("/api/tasks/complete_current", { method: "POST" });
                if (response.ok) {
                    const result = await response.json();
                    if (result?.next_task) {
                        $("stop-task-name").textContent = result.next_task.title;
                        $("stop-pill-task").textContent = result.next_task.title;
                        startStopTimer();
                        await fetchStatus();
                        return;
                    }
                    await fetchStatus();
                }
            } catch (error) {
                if (currentPlan?.steps) {
                    currentPlan.steps.forEach((step) => step.status = "completed");
                }
            }
            showDashboard();
        }

        async function fetchStatus() {
            try {
                const response = await fetch("/status");
                if (!response.ok) throw new Error("offline");
                currentStatus = await response.json();
                const active = currentStatus.current_task || currentStatus.task;
                const title = typeof active === "string" ? active : active?.title;
                if (title) {
                    $("stop-task-name").textContent = title;
                    $("stop-pill-task").textContent = title;
                }
                if (Number(currentStatus.overrun_seconds) > 0) {
                    $("stop-timer").textContent = `+${formatSeconds(currentStatus.overrun_seconds)}`;
                } else if (Number.isFinite(Number(currentStatus.remaining_time))) {
                    $("stop-timer").textContent = formatSeconds(currentStatus.remaining_time);
                }
                if (currentStatus.plan_completed) {
                    showDashboard();
                }
            } catch (error) {
                currentStatus = null;
            }
        }

        function showDashboard() {
            window.clearInterval(timerInterval);
            window.clearInterval(statusTimer);
            renderDashboard();
            showScreen("dashboard");
        }

        function renderDashboard() {
            const progress = currentStatus?.plan_progress || {};
            const total = Number(progress.total) || currentPlan?.steps?.length || 0;
            const completed = Number(progress.completed) || currentPlan?.steps?.filter((step) => step.status === "completed").length || total;
            const percent = total ? Math.round((completed / total) * 100) : 0;
            const focusMinutes = Math.max(0, Math.round(timerSeconds / 60));
            const overrunMinutes = Math.max(0, Math.ceil((Number(currentStatus?.overrun_seconds) || 0) / 60));
            const distractions = Number(currentStatus?.violation_count || currentStatus?.distraction_count || 0);

            $("completion-pct").textContent = `${percent}%`;
            $("circle-fill").style.strokeDasharray = `${percent}, 100`;
            $("focus-minutes").textContent = `${focusMinutes}m`;
            $("overrun-minutes").textContent = `+${overrunMinutes}m`;
            $("distraction-count").textContent = `${distractions}회`;

            renderReviewList("work-review", "WORK");
            renderReviewList("routine-review", "ROUTINE");
            renderTimeMarks();

            $("insight-footer").innerHTML = `<b>패턴 피드백</b><br>${buildInsight(percent, overrunMinutes, distractions)}`;
        }

        function renderReviewList(targetId, category) {
            const target = $(targetId);
            const tasks = currentPlan?.steps?.filter((step) => step.category === category) || [];
            target.innerHTML = "";
            const visible = tasks.length ? tasks : [{ title: category === "WORK" ? "집중 작업 없음" : "루틴 작업 없음", status: "pending" }];
            visible.slice(0, 4).forEach((task) => {
                const row = document.createElement("div");
                row.className = "check-item";
                const box = document.createElement("div");
                box.className = "chk-box";
                box.textContent = task.status === "pending" ? "" : "V";
                const text = document.createElement("span");
                text.className = `chk-text ${category === "WORK" ? "hl-blue" : "hl-green"}`;
                text.textContent = task.title;
                row.append(box, text);
                target.appendChild(row);
            });
        }

        function renderTimeMarks() {
            const target = $("time-marks");
            const pattern = currentPlan?.steps?.slice(0, 9) || [];
            target.innerHTML = "";
            for (let index = 0; index < 9; index += 1) {
                const step = pattern[index];
                const slot = document.createElement("div");
                slot.className = "time-slot";
                slot.innerHTML = `<span class="hour">${index + 9 > 12 ? index - 3 : index + 9}</span><div class="bar ${step ? (step.category === "ROUTINE" ? "routine" : "work") : "none"}"></div>`;
                target.appendChild(slot);
            }
        }

        function buildInsight(percent, overrunMinutes, distractions) {
            if (percent >= 100) return "모든 스텝을 끝냈어요. 오늘은 마무리 기준이 분명해서 다음 작업으로 넘어가기 쉬웠습니다.";
            if (overrunMinutes > 0) return "예상보다 시간이 조금 길어졌어요. 다음에는 첫 두 스텝을 5분 단위로 더 작게 잡아볼 만합니다.";
            if (distractions > 0) return "중간에 흐름이 흔들린 순간이 있었지만, 다시 돌아올 수 있는 단서가 남아 있었어요.";
            return "작게 쪼갠 덕분에 시작 장벽이 낮아졌어요. 다음 계획도 첫 스텝은 아주 쉽게 잡아주세요.";
        }

        async function loadLatestPlan() {
            try {
                const response = await fetch("/api/mobile/latest_plan");
                const plan = await response.json();
                if (plan?.plan_id && plan?.status === "active") {
                    currentPlan = normalizePlan(plan);
                    const step = firstRunnableStep();
                    if (step) {
                        $("stop-task-name").textContent = step.title;
                        $("stop-pill-task").textContent = step.title;
                    }
                    startStopTimer();
                    showScreen("stop");
                    await fetchStatus();
                    statusTimer = window.setInterval(fetchStatus, 3000);
                }
            } catch (error) {
                currentPlan = null;
            }
        }

        $("send-btn").addEventListener("click", () => makePlanFromGoal($("manual-input").value));
        $("manual-input").addEventListener("keydown", (event) => {
            if (event.key === "Enter") makePlanFromGoal(event.currentTarget.value);
        });
        $("send-pc-btn").addEventListener("click", startPlan);
        $("done-btn").addEventListener("click", completeCurrentTask);

        const Recognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        let isRecording = false;

        if (Recognition) {
            const recognition = new Recognition();
            recognition.lang = "ko-KR";
            recognition.onresult = (event) => {
                const text = event.results[0][0].transcript;
                $("manual-input").value = text;
                makePlanFromGoal(text);
            };
            recognition.onend = () => {
                isRecording = false;
                updateMicUI(false);
            };
            $("mic-btn").addEventListener("click", () => {
                if (!isRecording) {
                    recognition.start();
                    isRecording = true;
                    updateMicUI(true);
                } else {
                    recognition.stop();
                }
            });
        } else {
            $("mic-btn").addEventListener("click", () => {
                updateMicUI(true);
                window.setTimeout(() => {
                    updateMicUI(false);
                    toast("이 브라우저에서는 음성 입력을 지원하지 않아요.");
                    $("manual-input").focus();
                }, 700);
            });
        }

        function updateMicUI(active) {
            const button = $("mic-btn");
            button.querySelector(".mic-text").textContent = active ? "듣고 있어요..." : "말로 시작하기";
            button.style.transform = active ? "scale(1.1)" : "scale(1)";
        }

        loadLatestPlan();
    </script>
</body>
</html>
